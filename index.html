<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Multiverse Sketch Pad</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Multiverse">
<meta name="theme-color" content="#0C0F11">
<link rel="apple-touch-icon" href="icon.jpg">
<link rel="manifest" href="manifest.json">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0C0F11; overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  /* keep the UI clear of the camera housing and the home indicator */
  #root {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    bottom: env(safe-area-inset-bottom, 0px);
    left: env(safe-area-inset-left, 0px);
    right: env(safe-area-inset-right, 0px);
  }
  input[type=range] { touch-action: manipulation; }
</style>
</head>
<body>
<div id="root"></div>
<script>

     3. localStorage     - sandboxed iframes often block IndexedDB

   tell the truth instead of just saying "not saved". */

    window.__storageTier = "host";

        rq.onsuccess = function () { res(rq.result); };
        rq.onerror = function () { rej(rq.error); };
      });
    });

  var mem = {};
  function lsOK() {
    try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); return true; }
    catch (e) { return false; }
  }

  function fallbackGet(k) {
    if (lsOK()) { var v = localStorage.getItem(k); if (v !== null) return v; throw new Error("not found"); }
    if (k in mem) return mem[k];
    throw new Error("not found");
  }
  function fallbackSet(k, v) {
    if (lsOK()) { localStorage.setItem(k, v); window.__storageTier = "localStorage"; return; }
    mem[k] = v; window.__storageTier = "memory";
  }

  /* Decide the tier for real at startup instead of assuming IndexedDB
     and only finding out on the first failed write. A page that cannot
     store anything must say so plainly, not quietly drop the work. */
  window.__storageTier = "probing";
  window.__storageProbe = (function () {
    return idb("readwrite", function (s) { return s.put("1", "__probe"); })
      .then(function () {
        return idb("readwrite", function (s) { return s["delete"]("__probe"); });

      .then(function () { window.__storageTier = "indexeddb"; return "indexeddb"; })
      .catch(function () {
        if (lsOK()) { window.__storageTier = "localStorage"; return "localStorage"; }
        window.__storageTier = "memory";

  window.storage = {
    get: function (k) {
      return idb("readonly", function (s) { return s.get(k); })
        .then(function (v) {

          return { key: k, value: v, shared: false };
        })
        .catch(function (e) {
          if (String(e && e.message) === "not found") throw e;
          return { key: k, value: fallbackGet(k), shared: false };
        });
    },
    set: function (k, v) {
      return idb("readwrite", function (s) { return s.put(v, k); })
        .then(function () { return { key: k, value: v, shared: false }; })
        .catch(function () { fallbackSet(k, v); return { key: k, value: v, shared: false }; });
    },
    "delete": function (k) {
      return idb("readwrite", function (s) { return s["delete"](k); })
        .then(function () { return { key: k, deleted: true, shared: false }; })
        .catch(function () {
          try { localStorage.removeItem(k); } catch (e) {}

    }

})();

/* nx,ny: a FIXED offset direction for a chisel nib. A round brush

   you move. A broad-edge pen offsets along a fixed nib angle instead,

   across it runs full width. That difference is the whole effect. */

  for (let i = 1; i < n; i++) span += Math.abs(xs[i] - xs[i - 1]) + Math.abs(ys[i] - ys[i - 1]);

  const ny = SNY;

     samples. Adjacent samples sit ~1px apart, so digitiser jitter of a
     fraction of a pixel swings the tangent by degrees, and the ribbon
     edge inherits every swing as a facet. A +/-2 window roughly halves
     that; +/-3 halves it again. */
  const K = 3;
  for (let i = 0; i < n; i++) {
    const lo = i - K < 0 ? 0 : i - K;
    const hi = i + K > n - 1 ? n - 1 : i + K;

    let dy = ys[hi] - ys[lo];

      dy = ys[Math.min(i + 1, n - 1)] - ys[Math.max(i - 1, 0)];

       which way you travel — that is the whole broad-edge effect.
       A little of the LOCAL normal is mixed in as nib thickness. Pure
       nib offset makes a stroke travelling exactly along the nib a
       zero-area polygon that vanishes; a real pen leaves a hairline.
       Mixing the normal keeps it a simple two-edge ribbon, so nothing
       self-intersects and the winding stays clean. */
    let th = 0;
    for (let i = 0; i < n; i++) th = Math.max(th, hw[i]);
    th = Math.max(0.4, th * 0.07);

    /* One outline will not do here. Because the offset direction is
       fixed, the ribbon turns inside out wherever the travel direction
       crosses the nib angle — on a hairpin, or anywhere a stroke doubles
       back. The two edges swap sides, that loop winds the opposite way,
       and nonzero fill cancels it into a bite-shaped hole.
        Drawing each segment as its own quad, all wound the same way,
       makes the result a union instead. Still one fill(), so opacity is
       untouched. */

      const ax = DX[i] + nbx * DH[i] + DNX[i] * th;
      const ay = DY[i] + nby * DH[i] + DNY[i] * th;
      const bx = DX[i + 1] + nbx * DH[i + 1] + DNX[i + 1] * th;
      const by = DY[i + 1] + nby * DH[i + 1] + DNY[i + 1] * th;
      const cX = DX[i + 1] - nbx * DH[i + 1] - DNX[i + 1] * th;
      const cY = DY[i + 1] - nby * DH[i + 1] - DNY[i + 1] * th;
      const dX = DX[i] - nbx * DH[i] - DNX[i] * th;
      const dY = DY[i] - nby * DH[i] - DNY[i] * th;
      ctx.moveTo(ax, ay);
      if ((bx - ax) * (cY - ay) - (by - ay) * (cX - ax) >= 0) {
        ctx.lineTo(bx, by);

  // carves a crescent out of the end of the stroke.
  const aEnd = Math.atan2(ny[n - 1], nx[n - 1]);
  ctx.arc(xs[n - 1], ys[n - 1], hw[n - 1], aEnd, aEnd - Math.PI, true);

    if (flat[i] > maxX) maxX = flat[i];
    if (flat[i + 1] < minY) minY = flat[i + 1];
    if (flat[i + 1] > maxY) maxY = flat[i + 1];
  }

    pts: flat,

    width,
    minX,
    minY,
    maxX,

  minY = st.minY;

  maxY = st.maxY;

  if (minY < frame.bMinY) frame.bMinY = minY;

    erase: !!erase,
    user: true,
    pts: null,
    p: null,
    t: "shape",
    minX: Math.min(sh.x0, sh.x1) - pad,
    minY: Math.min(sh.y0, sh.y1) - pad,
    maxX: Math.max(sh.x0, sh.x1) + pad,
    maxY: Math.max(sh.y0, sh.y1) + pad

  if (st.minX < frame.bMinX) frame.bMinX = st.minX;
  if (st.minY < frame.bMinY) frame.bMinY = st.minY;
  if (st.maxX > frame.bMaxX) frame.bMaxX = st.maxX;
  if (st.maxY > frame.bMaxY) frame.bMaxY = st.maxY;

    if (s.maxX > frame.bMaxX) frame.bMaxX = s.maxX;
    if (s.maxY > frame.bMaxY) frame.bMaxY = s.maxY;

/* Content is a NESTED fractal, not scattered shapes.

   Scattering fails: at zoom 282 the viewport covers 0.001% of a cell,
   so a uniformly scattered shape has a ~1-in-100,000 chance of being
   on screen. The frame contributes nothing and every visible thing has
   to come from the child tier, arriving all at once.

   Nesting fixes it: each shape carries smaller shapes on its own rim,
   so wherever you point the camera there is structure at your scale,
   and it GROWS into view at full opacity instead of fading in.  */
const BRANCH_R = 0.35; // child shape radius, as a fraction of parent
const LEAF_R = 0.42; // stop here; child CELLS take over below

function generate(f) {
  if (f.gen) return;
  f.gen = true;
  const rnd = mulberry(frameSeed(f));
  const seen = new Set();
  f.seeds = [];
  const node = (cx, cy, r, rot, ci) => {
    const color = INKS[ci % INKS.length];
    const sides = 3 + Math.floor(rnd() * 6);
    const poly = [];
    for (let k = 0; k <= sides; k++) {
      const t = rot + k / sides * Math.PI * 2;
      poly.push(cx + Math.cos(t) * r, cy + Math.sin(t) * r);
    }
    addStroke(f, poly, color, r * 0.05);

    for (let k = 0; k <= 44; k++) {
      const t = k / 44 * Math.PI * 2;
      ring.push(cx + Math.cos(t) * r * 0.55, cy + Math.sin(t) * r * 0.55);
    }
    addStroke(f, ring, color, r * 0.022);
    if (r <= LEAF_R) {
      // hand off to a child cell, which restarts the whole structure
      // one tier down. its largest shape is 400/1024 = 0.39 units,
      // which is where this frame's smallest shape leaves off.
      const gx = Math.floor(cx);
      const gy = Math.floor(cy);
      const key = gx + "|" + gy;
      if (!seen.has(key)) {
        seen.add(key);
        f.seeds.push({
          gx,
          gy,
          ox: 0.3 + rnd() * 0.4,
          oy: 0.3 + rnd() * 0.4
        });
      }
      return;
    }
    for (let b = 0; b < 2; b++) {
      const t = rot + b * Math.PI + (rnd() - 0.5) * 1.3;
      const d = r * 0.74;
      node(cx + Math.cos(t) * d, cy + Math.sin(t) * d, r * BRANCH_R, rot + 1.05 + (rnd() - 0.5) * 0.8, ci + 1);
    }
  };
  node(300 + rnd() * 424, 300 + rnd() * 424, 380, rnd() * Math.PI * 2, Math.floor(rnd() * INKS.length));
}
